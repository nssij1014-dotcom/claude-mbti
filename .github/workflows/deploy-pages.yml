name: GitHub Pages Deployment

# API 라우트/DB 기반 라우트를 제외한 static export만 배포합니다.
# 실제 서비스(API, 동적 OG, 테스트 결과 저장)는 deploy.yml(Vercel)이 담당합니다.
on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Remove routes unsupported by static export
        run: node scripts/prepare-pages-export.mjs

      - name: Build static export
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_SITE_URL: https://nssij1014-dotcom.github.io/claude-mbti
        run: npm run build

      - name: Disable Jekyll processing
        run: touch out/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
